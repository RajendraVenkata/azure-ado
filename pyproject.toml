[project]
name = "ado-migrate"
version = "0.1.0"
description = "Azure DevOps org-to-org migration framework"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "azure-devops>=7.1.0b4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
migrate = "ado_migrate.cli:main"
seed-ado = "ado_migrate.seed_ado:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::_pytest.warning_types.PytestCollectionWarning",
]
